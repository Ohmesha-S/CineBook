<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Theatre & Showtime - CineBook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/movies.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-film"></i></div>
        <span>Cine<span class="highlight">Book</span></span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/movies.html" class="nav-link"><i class="fas fa-play"></i> Movies</a></li>
        <li><a href="/my-bookings.html" class="nav-link"><i class="fas fa-ticket-alt"></i> My Bookings</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">

    <!-- Movie Brief Banner -->
    <div class="theatre-card" style="margin-bottom: 2rem; background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div>
        <span class="badge badge-primary"><i class="fas fa-ticket-alt"></i> Step 1: Choose Showtime</span>
        <h1 id="theatrePageMovieTitle" style="font-size: 1.85rem; margin-top: 0.5rem;">Select Theatre</h1>
        <p id="theatrePageMovieMeta" style="color: var(--text-muted); font-size: 0.9rem;">Loading show schedule...</p>
      </div>
      <div>
        <a id="backToMovieBtn" href="/movies.html" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Change Movie
        </a>
      </div>
    </div>

    <!-- Date Ribbon -->
    <section style="margin-bottom: 2rem;">
      <h3 style="font-size: 1.1rem; margin-bottom: 0.75rem;"><i class="fas fa-calendar-day text-gradient"></i> Select Date</h3>
      <div class="date-selector">
        <div class="date-ribbon" id="dateRibbon">
          <!-- Injected dynamically -->
        </div>
      </div>
    </section>

    <!-- Available Theatres List -->
    <section style="margin-bottom: 4rem;">
      <h3 style="font-size: 1.1rem; margin-bottom: 1.25rem;"><i class="fas fa-city text-gradient"></i> Available Cinema Halls</h3>
      <div id="theatresListContainer">
        <!-- Injected dynamically -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 CineBook System. Built for Java Programming Lab Evaluation.</div>
        <div><a href="/index.html" style="color: var(--accent-primary);">Home</a></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get('movieId');
    let selectedDate = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!movieId) {
        showToast('Please select a movie first', 'info');
        window.location.href = '/movies.html';
        return;
      }

      try {
        const movieRes = await fetchApi(`/movies/${movieId}`);
        const movie = movieRes.data;
        setDynamicMovieBackground(movie.backdropUrl || movie.posterUrl, movie.title, true);
        document.getElementById('theatrePageMovieTitle').textContent = movie.title;
        document.getElementById('theatrePageMovieMeta').textContent = `${movie.genre} • ${movie.language} • ${movie.durationMinutes} mins • Rating: ${movie.rating}`;
        document.getElementById('backToMovieBtn').href = `/movie-details.html?id=${movie.id}`;
        document.title = `Theatres for ${movie.title} - CineBook`;

        // Load dates
        const datesRes = await fetchApi(`/shows/movie/${movieId}/dates`);
        const dates = datesRes.data || [];
        const ribbon = document.getElementById('dateRibbon');

        if (dates.length === 0) {
          ribbon.innerHTML = `<p style="color: var(--text-muted);">No show dates scheduled currently for this movie.</p>`;
          return;
        }

        selectedDate = dates[0];
        ribbon.innerHTML = dates.map((dStr, idx) => {
          const d = new Date(dStr);
          const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
          const monthName = d.toLocaleDateString('en-US', { month: 'short' });
          const dayNum = d.getDate();
          return `
            <div class="date-card ${idx === 0 ? 'active' : ''}" onclick="changeDate('${dStr}', this)">
              <div class="date-day">${dayName}</div>
              <div class="date-num">${dayNum}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${monthName}</div>
            </div>
          `;
        }).join('');

        loadTheatres(selectedDate);
      } catch (err) {
        showToast('Failed to load movie info: ' + err.message, 'error');
      }
    });

    function changeDate(dStr, elem) {
      selectedDate = dStr;
      document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
      if (elem) elem.classList.add('active');
      loadTheatres(dStr);
    }

    async function loadTheatres(dStr) {
      const container = document.getElementById('theatresListContainer');
      container.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-spin icon"></i><p>Loading theatres and screens...</p></div>`;

      try {
        const theatresRes = await fetchApi(`/theatres/movie/${movieId}`);
        const theatres = theatresRes.data || [];

        if (theatres.length === 0) {
          container.innerHTML = `<div class="empty-state"><i class="fas fa-film icon"></i><p>No theatres currently showing this movie.</p></div>`;
          return;
        }

        let html = '';
        for (const theatre of theatres) {
          const showsRes = await fetchApi(`/shows/schedule?movieId=${movieId}&theatreId=${theatre.id}&date=${dStr}`);
          const shows = showsRes.data || [];

          if (shows.length > 0) {
            html += `
              <div class="theatre-card">
                <div class="theatre-header">
                  <div>
                    <h3 class="theatre-name"><i class="fas fa-film text-gradient"></i> ${theatre.name}</h3>
                    <p class="theatre-address"><i class="fas fa-map-marker-alt"></i> ${theatre.address || theatre.location}</p>
                  </div>
                  <span class="badge badge-cyan">${theatre.location}</span>
                </div>
                <div class="showtimes-grid">
                  ${shows.map(s => {
                    const isPast = (new Date(`${s.showDate}T${s.startTime}`)) < new Date();
                    if (isPast) {
                      return `
                        <div class="showtime-chip" style="opacity: 0.4; cursor: not-allowed; border-color: rgba(255,255,255,0.08);" title="This show time has passed">
                          <span class="showtime-time">${formatTime(s.startTime)} (Passed)</span>
                          <span class="showtime-type">${s.screenName}</span>
                        </div>
                      `;
                    }
                    return `
                      <a href="/seat-selection.html?showId=${s.id}" class="showtime-chip" title="Select Seats for this show">
                        <span class="showtime-time">${formatTime(s.startTime)}</span>
                        <span class="showtime-type">${s.screenName}</span>
                      </a>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }
        }

        container.innerHTML = html || `<div class="empty-state"><p>No shows scheduled for ${formatDate(dStr)}.</p></div>`;
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>Failed to load shows: ${err.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
