<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Movies - CineBook Movie Catalog</title>
  <meta name="description" content="Browse all available movies, search by genre or language, and book theatre tickets.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/movies.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-film"></i></div>
        <span>Cine<span class="highlight">Book</span></span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/movies.html" class="nav-link active"><i class="fas fa-play"></i> Movies</a></li>
        <li><a href="/my-bookings.html" class="nav-link"><i class="fas fa-ticket-alt"></i> My Bookings</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: 2rem;">

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800;">Explore Movie Catalog</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Find the latest blockbusters and reserve your preferred seats</p>
      </div>
      <span class="badge badge-primary" id="catalogCountBadge" style="font-size: 0.85rem; padding: 0.4rem 0.9rem;">
        Loading...
      </span>
    </div>

    <!-- Multi-Filter & Search Bar -->
    <section class="filter-bar">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 1rem; align-items: center;">
        <div class="search-box" style="max-width: 100%;">
          <i class="fas fa-search"></i>
          <input type="text" id="catalogSearch" placeholder="Search by title, director, cast...">
        </div>

        <div>
          <select id="catalogGenre" class="form-control" style="padding: 0.75rem 0.75rem;">
            <option value="ALL">All Genres</option>
          </select>
        </div>

        <div>
          <select id="catalogLanguage" class="form-control" style="padding: 0.75rem 0.75rem;">
            <option value="ALL">All Languages</option>
          </select>
        </div>

        <div>
          <select id="catalogStatus" class="form-control" style="padding: 0.75rem 0.75rem;">
            <option value="ALL">All Status</option>
            <option value="NOW_SHOWING">Now Showing</option>
            <option value="UPCOMING">Upcoming</option>
          </select>
        </div>

        <div>
          <select id="catalogSort" class="form-control" style="padding: 0.75rem 0.75rem;">
            <option value="default">Default Sort</option>
            <option value="title_asc">Title (A-Z)</option>
            <option value="duration_asc">Shortest First</option>
            <option value="duration_desc">Longest First</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Movies Grid -->
    <section class="movies-grid" id="catalogGrid">
      <!-- Injected by movies.js -->
    </section>

  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 CineBook System. Built for Java Programming Lab Evaluation.</div>
        <div><a href="/index.html" style="color: var(--accent-primary);">Back to Home</a></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/movies.js"></script>
</body>
</html>
