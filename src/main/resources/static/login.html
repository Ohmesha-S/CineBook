<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CineBook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-film"></i></div>
        <span>Cine<span class="highlight">Book</span></span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/movies.html" class="nav-link"><i class="fas fa-play"></i> Movies</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">
          <i class="fas fa-user-lock"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to access your bookings and reserve tickets</p>
      </div>

      <!-- Quick Demo Credentials Box for Lab Evaluation -->
      <div class="auth-demo-box">
        <p><i class="fas fa-magic"></i> Quick Autofill for Lab Evaluation</p>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" onclick="fillAdminCredentials()">
            <i class="fas fa-shield-alt"></i> Fill Admin
          </button>
          <button type="button" class="demo-btn" onclick="fillCustomerCredentials()">
            <i class="fas fa-user"></i> Fill Customer
          </button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <span class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
