<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account - CineBook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon"><i class="fas fa-film"></i></div>
        <span>Cine<span class="highlight">Book</span></span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/movies.html" class="nav-link"><i class="fas fa-play"></i> Movies</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1>Create CineBook Account</h1>
        <p>Register as a new customer to book tickets</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" autocomplete="tel">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters) *</label>
          <div class="password-input-wrap">
            <input type="password" id="password" class="form-control" placeholder="Create strong password" required minlength="6" autocomplete="new-password">
            <span class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password *</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
            <span class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Create Account <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/login.html">Sign In</a>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
