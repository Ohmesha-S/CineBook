# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ohm@SQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/

# Java Socket Networking Configuration (Concept 5: Networking using Java)
cinema.socket.server.port=8888
cinema.socket.server.enabled=true

# Java for Operating System Configuration (Concept 6: Java for OS)
cinema.os.ticket.dir=tickets
cinema.os.launch.viewer=true

# Default Initial Admin Credentials
app.admin.email=${ADMIN_EMAIL:admin@cinebook.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=System Administrator
app.admin.phone=9876543210
